name: Publish

on:
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: read

jobs:
  native:
    name: native ${{ matrix.target }}
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: darwin-arm64
            runner: macos-latest
          - target: darwin-amd64
            runner: macos-15-intel
          - target: linux-arm64
            runner: ubuntu-24.04-arm
          - target: linux-amd64
            runner: ubuntu-latest
    steps:
      - name: Checkout release tag
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false

      - name: Install pnpm
        uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10

      - name: Setup Node.js
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Install expect on Linux
        if: startsWith(matrix.runner, 'ubuntu-')
        run: sudo apt-get update && sudo apt-get install --yes expect

      - name: Build and test native binary
        run: pnpm run test:e2e

      - name: Prepare release assets
        run: |
          cp "bin/native/legibility-${{ matrix.target }}" "legibility-${{ matrix.target }}"
          node -e 'const fs = require("node:fs"); const crypto = require("node:crypto"); const path = process.argv[1]; const digest = crypto.createHash("sha256").update(fs.readFileSync(path)).digest("hex"); process.stdout.write(digest + "  " + path + "\n");' "legibility-${{ matrix.target }}" > "legibility-${{ matrix.target }}.sha256"

      - name: Upload native assets
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: native-${{ matrix.target }}
          path: |
            legibility-${{ matrix.target }}
            legibility-${{ matrix.target }}.sha256

  publish:
    name: publish npm and GitHub release
    needs: native
    runs-on: macos-latest
    environment: npm-publish
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - name: Checkout release tag
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false

      - name: Install pnpm
        uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10

      - name: Setup Node.js
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Validate release version
        env:
          RELEASE_REF: ${{ github.ref_name }}
        run: |
          VERSION="${RELEASE_REF#v}"
          PACKAGE_VERSION="$(node -p 'require("./package.json").version')"
          test "$VERSION" = "$PACKAGE_VERSION"

      - name: Run checks and tests
        run: |
          pnpm run check
          pnpm run test:unit
          pnpm run test:integration

      - name: Pack npm package
        id: pack
        run: |
          npm pack --ignore-scripts --json > npm-pack.json
          TARBALL="$(node -e 'const fs = require("node:fs"); const [pkg] = JSON.parse(fs.readFileSync("npm-pack.json", "utf8")); console.log(pkg.filename)')"
          test -n "$TARBALL"
          echo "tarball=$TARBALL" >> "$GITHUB_OUTPUT"

      - name: Resolve npm dist-tag
        id: dist-tag
        env:
          RELEASE_REF: ${{ github.ref_name }}
        run: |
          VERSION="${RELEASE_REF#v}"
          case "$VERSION" in
            *-alpha*) TAG=alpha ;;
            *-beta*) TAG=beta ;;
            *-rc*) TAG=rc ;;
            *) TAG=latest ;;
          esac
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"

      - name: Publish npm package
        env:
          PACKAGE_VERSION: ${{ github.ref_name }}
          TARBALL: ${{ steps.pack.outputs.tarball }}
        run: |
          VERSION="${PACKAGE_VERSION#v}"
          if npm view "legibility@$VERSION" version >/dev/null 2>&1; then
            echo "legibility@$VERSION is already published"
            exit 0
          fi
          npm publish "$TARBALL" --provenance --access public --tag "${{ steps.dist-tag.outputs.tag }}"

      - name: Download native assets
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: native-*
          merge-multiple: true

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.ref_name }}
          TARBALL: ${{ steps.pack.outputs.tarball }}
        run: |
          ASSETS=("$TARBALL" legibility-darwin-* legibility-linux-* *.sha256)
          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            gh release upload "$RELEASE_TAG" "${ASSETS[@]}" --clobber
          else
            gh release create "$RELEASE_TAG" "${ASSETS[@]}" --title "$RELEASE_TAG" --generate-notes
          fi

  homebrew:
    name: update Homebrew tap
    needs: publish
    if: ${{ !contains(github.ref_name, '-') }}
    runs-on: macos-latest
    environment: homebrew-publish
    permissions:
      contents: read
    env:
      GH_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}
      VERSION: ${{ github.ref_name }}
    steps:
      - name: Validate Homebrew token
        run: |
          test -n "$GH_TOKEN"
          CAN_PUSH="$(gh api repos/yowainwright/homebrew-tap --jq '.permissions.push')"
          test "$CAN_PUSH" = true

      - name: Checkout Homebrew tap
        run: gh repo clone yowainwright/homebrew-tap tap

      - name: Update and validate formula
        run: |
          cd tap
          ./scripts/update-formula legibility "${VERSION#v}"
          ./scripts/validate-tap

      - name: Open Homebrew tap pull request
        run: |
          cd tap
          BRANCH="legibility-${VERSION}-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          git switch -c "$BRANCH"
          git add Formula/legibility.rb brews/legibility.json README.md
          git -c user.name=github-actions -c user.email=41898282+github-actions[bot]@users.noreply.github.com commit -m "legibility ${VERSION#v}"
          git push --set-upstream origin "$BRANCH"
          gh pr create --base main --head "$BRANCH" --title "legibility ${VERSION#v}" --body "Automated formula update for legibility ${VERSION#v}."
